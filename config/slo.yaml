service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Giữ mục tiêu 99.5% request thành công trong 3000ms trên cửa sổ 28 ngày:
    10 request baseline đều trả 200 và dưới 2000ms, nhưng mẫu này quá nhỏ để
    hiệu chỉnh ngưỡng dài hạn. Error budget là 100% - 99.5% = 0.5%;
    với 10,000 request, tối đa 50 request được phép lỗi hoặc chậm hơn 3000ms.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
